# Dependabot keeps dependencies patched so a known-vulnerable transitive
# release is surfaced as a PR instead of being silently pulled in by the
# unbounded ">=" pins in requirements.txt / package.json on the next build.
version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # numpy 2.5+ requires Python >= 3.12 but this repo pins Python 3.11
    # (CI setup-python, docs/engineering/testing.md), so minor bumps to the
    # 2.5 line are unsatisfiable for the lockfiles. Patch updates within
    # 2.4.x remain allowed. Lift this when the repo moves to Python 3.12.
    ignore:
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-minor"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Embedding-server sidecar entries were removed with the directory
  # (ENH-003): harrier-embed in docker-compose.yml replaced flag-embed-server,
  # leaving backend/embedding_server dormant and caller-free.

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker base images (root + frontend build/runtime stages).
  # Major base-image moves are gated by scripts/check_runtime_contract.py
  # (the runtime pin table is the single decision point), so Dependabot only
  # offers minor/patch/digest updates for docker; a 14-day cooldown lets new
  # releases settle before a bump PR is opened.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 14
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
    # Not a real Dependabot update type (runtime no-op per
    # dependabot-core ignore_condition.rb); pinned verbatim by the
          - "version-update:semver-major"
          # Pinned verbatim by the frozen AC9 acceptance check's spelling;
    cooldown:
      default-days: 14

  # Docker Compose image pins (issue #750, T1-04-K-05): the digest pins in
  # docker-compose.yml (harrier-embed, reranker, redis) are only updated by
  # this ecosystem — the `docker` entries above scan Dockerfiles and never
  # touch compose files, while docker-compose.yml's own comments promise
  # dependabot digest PRs. Same semver-major ignore + 14-day cooldown
  # posture as the `docker` entries. NOTE: check_runtime_contract only gates
  # the Dockerfile FROM pins (DOCKERFILE_SURFACES / ALLOWED_DIGESTS); no CI
  # gate pins or checks the freshness of these compose `image:` digest values
  # (test_i03_compose_contracts only asserts harrier-embed stays
  # digest-pinned), so this entry is their only automated freshness guard.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 14

  # GitHub Actions workflow pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
