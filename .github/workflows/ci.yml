name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Verify frontend toolchain graph
        run: |
          node --version
          npm --version
          npm ls vite vitest @vitejs/plugin-react jsdom
          npm exec vite -- --version
          npm exec vitest -- --version

      - name: Type check
        run: npm run typecheck

      - name: Type check interface contracts
        run: npm run typecheck:contracts

      - name: Lint
        run: npm run lint

      - name: API smoke tests
        run: npm test -- src/lib/api.test.ts src/lib/api.csrf.test.ts src/lib/api.sse.test.ts src/pages/WikiPage.sse.test.tsx src/stores/useAuthStore.api-base.test.ts

      - name: Accessibility smoke tests
        run: npm run test:a11y

      - name: Test
        run: npm test

      - name: Coverage gate (api + stores contract surfaces)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build subpath deployment
        run: npm run build
        env:
          VITE_APP_BASENAME: /knowledgevault
          VITE_API_URL: /knowledgevault/api

      - name: Build subpath deployment (derived API URL)
        run: npm run build
        env:
          VITE_APP_BASENAME: /meridian

  # Issue #573 (AC7): browser-level smoke tier — send / stop-mid-stream /
  # reload-restores-history / citation-opens-source against the production
  # build (`vite preview`, API proxied to a zero-dependency stub backend on
  # :9090). Separate from the Frontend job so the vitest/typecheck/lint/build
  # gates never depend on Playwright stability.
  e2e:
    name: Playwright e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install app dependencies and build
        working-directory: frontend
        run: |
          npm ci --engine-strict
          npm run build

      - name: Run e2e smoke suite
        run: npx playwright test --reporter=line

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.97
        with:
          name: playwright-report
          path: frontend/e2e/test-results/
          retention-days: 7

  quality-contracts:
    name: Quality contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Runtime version contract check
        run: python scripts/check_runtime_contract.py

      - name: Config and env contract check
        run: python scripts/check_config_contract.py

      - name: PR scope drift check
        run: python scripts/check_pr_scope_drift.py

      - name: SAST baseline integrity check
        run: python scripts/check_sast_baseline.py

      - name: Secretscan ignore validation
        run: python scripts/check_secretscan.py

      - name: Test collection scope check
        run: python scripts/check_test_collection_scope.py

  # BUILD-002: detect whether this run touches the docker build surface, so the
  # docker-smoke job below only spends CI minutes when the image definition
  # actually changed (Dockerfile, frontend/Dockerfile, docker-compose.yml).
  changes:
    name: Detect docker scope
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - Dockerfile
              - frontend/Dockerfile
              - docker-compose.yml

  # BUILD-002: smoke-build the root image (no push) whenever the docker surface
  # changes, so a green CI run proves the shipped image still builds under the
  # runtime pins enforced by scripts/check_runtime_contract.py.
  docker-smoke:
    name: Docker build smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build root image (no push)
        run: docker build --tag ragappv3:ci-smoke .

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install bandit
        run: pip install -r backend/requirements-dev.txt

      - name: SAST scan (fails on new findings or unused nosec suppressions)
        run: python scripts/run_bandit.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock-ci.txt
            backend/requirements-dev.txt

      - name: Install uv
        run: pip install uv==0.12.15

      # Universal lockfiles (issue #567): each lock must regenerate
      # byte-identically from its source spec with the same uv invocation the
      # update scripts use. Seeding the scratch file with the committed lock
      # pins every version; any drift (source edit without relock, or a
      # non-universal regeneration) fails the diff.
      - name: Verify lockfiles (universal regeneration)
        working-directory: .
        run: |
          for spec in requirements.txt:requirements-lock.txt requirements-ci.txt:requirements-lock-ci.txt; do
            src="backend/${spec%%:*}"
            lock="backend/${spec##*:}"
            cp "$lock" /tmp/verify-lock.txt
            uv pip compile --universal --generate-hashes --no-strip-extras --no-header \
              --python-version 3.11 "$src" -o /tmp/verify-lock.txt
            git diff --no-index --exit-code "$lock" /tmp/verify-lock.txt
          done

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-lock-ci.txt
          pip install -r requirements-dev.txt
          pip install pytest-xdist

      # test_issue566_config_loader_native.py parses the frontend config via
      # the TypeScript compiler; the Backend checkout has no frontend install,
      # so the guardrail's parser dependency is provided here (devDep version
      # from frontend/package.json; --no-save leaves the lockfile untouched).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.14.0"

      - name: Install TypeScript for the #566 config guardrail
        run: npm install --no-save typescript@6.0.3
        working-directory: frontend

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        # -rs: itemize skips (live-marker skips must be visible, not silent — issue #563)
        run: pytest --tb=short -v --timeout=300 -rs -n auto --cov --cov-report=term-missing tests/
        env:
          REDIS_URL: ""
