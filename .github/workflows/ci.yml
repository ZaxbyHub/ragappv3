name: CI

on:
  pull_request:
    branches: [master, codex/**]
  push:
    branches: [master]
  merge_group:

# A new push to a PR supersedes the in-flight run for the same PR ref. Only
# pull_request runs are cancelled. Non-PR events get a unique group (run_id):
# a shared group would still let GitHub drop an older PENDING run when a newer
# one queues, so two quick pushes to master or two merge_group runs would lose
# the middle run's required-check evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Verify frontend toolchain graph
        run: |
          node --version
          npm --version
          npm ls vite vitest @vitejs/plugin-react jsdom
          npm exec vite -- --version
          npm exec vitest -- --version

      # Issue #742 (AC5, "never in neither"): the two frontend-toolchain
      # contract nodes are pytest tests that need the frontend install, so
      # THIS job is their single CI venue. The Backend job no longer
      # installs a frontend tree (its #566 walker uses an outside-tree
      # TypeScript via NODE_PATH), so without this step the nodes would run
      # in no CI job at all. A skip here fails the step: a skipped node in
      # its only venue is "neither" again.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Frontend-toolchain contract nodes (#742 single-venue)
        working-directory: backend
        run: |
          python -m pip install --quiet pytest
          set +e
          python -m pytest \
            tests/test_issue258_coverage_gate.py::test_ac11_coverage_command_passes \
            tests/test_issue258_build_contracts.py::test_ac8_vite_node_config_project_typechecks \
            -q -p no:cacheprovider -rs > pytest-frontend-toolchain.log 2>&1
          EXIT=$?
          set -e
          cat pytest-frontend-toolchain.log
          if grep -q "skipped" pytest-frontend-toolchain.log; then
            echo "::error::a frontend-toolchain contract node SKIPPED in its single CI venue (must run here)"
            exit 1
          fi
          exit "$EXIT"

      - name: Type check
        run: npm run typecheck

      - name: Type check interface contracts
        run: npm run typecheck:contracts

      - name: Lint
        run: npm run lint

      - name: API smoke tests
        run: npm test -- src/lib/api.test.ts src/lib/api.csrf.test.ts src/lib/api.sse.test.ts src/pages/WikiPage.sse.test.tsx src/stores/useAuthStore.api-base.test.ts

      - name: Accessibility smoke tests
        run: npm run test:a11y

      - name: Test
        run: npm test

      - name: Coverage gate (api + stores contract surfaces)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build subpath deployment
        run: npm run build
        env:
          VITE_APP_BASENAME: /knowledgevault
          VITE_API_URL: /knowledgevault/api

      - name: Build subpath deployment (derived API URL)
        run: npm run build
        env:
          VITE_APP_BASENAME: /meridian

  # Issue #573 (AC7): browser-level smoke tier — send / stop-mid-stream /
  # reload-restores-history / citation-opens-source against the production
  # build (`vite preview`, API proxied to a zero-dependency stub backend on
  # :9090). Separate from the Frontend job so the vitest/typecheck/lint/build
  # gates never depend on Playwright stability.
  e2e:
    name: Playwright e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install app dependencies and build
        working-directory: frontend
        run: |
          npm ci --engine-strict
          npm run build

      - name: Run e2e smoke suite
        # Issue #778: the spec list is explicit so this job never absorbs new
        # spec files implicitly — the a11y matrix runs in its own job below.
        run: npx playwright test --reporter=line chat-smoke.spec.ts first-run-baseline.m01.spec.ts activity-tray.m04.spec.ts chat-width-budget.a07.spec.ts settings-badge-geometry.fb.spec.ts

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/e2e/test-results/
          retention-days: 7

  quality-contracts:
    name: Quality contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Runtime version contract check
        run: python scripts/check_runtime_contract.py

      - name: Config and env contract check
        run: python scripts/check_config_contract.py

      - name: Settings consumers check
        run: python scripts/check_settings_consumers.py

      - name: Batch-save mock seq contract check
        run: python scripts/check_batch_mock_seq.py

      - name: PR scope drift check
        run: python scripts/check_pr_scope_drift.py

      - name: SAST baseline integrity check
        run: python scripts/check_sast_baseline.py

      - name: Secretscan ignore validation
        run: python scripts/check_secretscan.py

      - name: Test collection scope check
        run: python scripts/check_test_collection_scope.py

      - name: HTTP 500 detail hygiene check
        run: python scripts/check_a04_http500_detail_hygiene.py

      - name: Upload migration timeout contract check
        run: python scripts/check_b03_upload_migration_timeout.py

      - name: Raw palette budget check
        run: python scripts/check_l05_raw_palette.py

      - name: Page header ownership check
        run: python scripts/check_l05_page_headers.py

      - name: A11y gate wiring check
        run: python scripts/check_l07_a11y_gate_wired.py

      - name: Generated skill trigger paths check
        run: python scripts/check_l09_skill_trigger_paths.py

      - name: Index asset links check
        run: python scripts/check_l09_index_assets.py

      - name: Memory response fields check
        run: python scripts/check_l09_memory_response_fields.py

      # Issue #789 (Workstream N PR 5): backend/frontend DraftClaim nullability parity.
      - name: DraftClaim nullable parity check
        run: python scripts/check_n05_draftclaim_nullable.py

  # Issue #778 (Workstream L PR 7): the route x viewport accessibility gate.
  # Separate from the e2e smoke job — the matrix is 141 serial tests and
  # must not share the smoke budget — and wired by
  # scripts/check_l07_a11y_gate_wired.py (Quality contracts).
  a11y-matrix:
    name: Playwright a11y matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install app dependencies and build
        working-directory: frontend
        run: |
          npm ci --engine-strict
          npm run build

      - name: Run a11y route x viewport matrix
        # --retries=1 rides out single-row flakes (config-level retries is 0);
        # --max-failures=20 stops a wholesale break early so failure artifacts
        # still upload inside the job budget (issue #778 review F-13).
        # a11y-rearm-865-868.spec.ts is the focused re-arm probe suite for the
        # #865-#868 rule families (wiki-card no-nesting, native list
        # semantics, and the historical dangling-aria-controls probe;
        # unnamed controls are guarded by the vitest census suite).
        run: npx playwright test --reporter=line a11y-matrix.spec.ts a11y-rearm-865-868.spec.ts --retries=1 --max-failures=20

      - name: Upload a11y failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-matrix-report
          path: frontend/e2e/test-results/
          retention-days: 7

  # BUILD-002: detect whether this run touches the docker build surface, so the
  # docker-smoke job below only spends CI minutes when the image definition
  # actually changed (Dockerfile, frontend/Dockerfile, docker-compose.yml).
  changes:
    name: Detect docker scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - Dockerfile
              - frontend/Dockerfile
              - frontend/.dockerignore
              - docker-compose.yml
              # The offline first-parse smoke mounts these two files; a
              # probe/fixture-only edit must still run the smoke (PR #1018
              # review F-006).
              - scripts/docker_smoke/**
              - backend/tests/fixtures/real_docs/sample_table.pdf

  # BUILD-002: smoke-build the root image (no push) whenever the docker surface
  # changes, so a green CI run proves the shipped image still builds under the
  # runtime pins enforced by scripts/check_runtime_contract.py.
  docker-smoke:
    name: Docker build smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build root image (no push)
        run: docker build --tag ragappv3:ci-smoke .

      # Issue #640: frontend/Dockerfile had no CI build, so its parse error
      # (and the NODE_ENV-devDependencies defect behind it) went unnoticed.
      - name: Build frontend image (no push)
        run: docker build -f frontend/Dockerfile --tag ragappv3-frontend:ci-smoke frontend/

      # Issue #1008: prove the baked NLTK data actually serves the FIRST
      # document parse in a fresh container with no network — a missing
      # tokenizer corpus is exactly what --network none reproduces.
      - name: Offline first-parse runtime smoke (issue #1008)
        run: >
          docker run --rm --network none
          -e ADMIN_SECRET_TOKEN=offline-smoke-test-only-token-0123456789
          -e JWT_SECRET_KEY=offline-smoke-test-only-key-0123456789abcdef
          -v ${{ github.workspace }}/scripts/docker_smoke/offline_parse_probe.py:/smoke/parse_probe.py:ro
          -v ${{ github.workspace }}/backend/tests/fixtures/real_docs/sample_table.pdf:/smoke/fixture.pdf:ro
          --entrypoint python ragappv3:ci-smoke /smoke/parse_probe.py /smoke/fixture.pdf

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install bandit
        run: pip install -r backend/requirements-dev.txt

      - name: SAST scan (fails on new findings or unused nosec suppressions)
        run: python scripts/run_bandit.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock-ci.txt
            backend/requirements-dev.txt

      - name: Install uv
        run: pip install uv==0.12.15

      # Universal lockfiles (issue #567): each lock must regenerate
      # byte-identically from its source spec with the same uv invocation the
      # update scripts use. Seeding the scratch file with the committed lock
      # pins every version; any drift (source edit without relock, or a
      # non-universal regeneration) fails the diff.
      - name: Verify lockfiles (universal regeneration)
        working-directory: .
        run: |
          for spec in requirements.txt:requirements-lock.txt requirements-ci.txt:requirements-lock-ci.txt; do
            src="backend/${spec%%:*}"
            lock="backend/${spec##*:}"
            cp "$lock" /tmp/verify-lock.txt
            uv pip compile --universal --generate-hashes --no-strip-extras --no-header \
              --python-version 3.11 "$src" -o /tmp/verify-lock.txt
            git diff --no-index --exit-code "$lock" /tmp/verify-lock.txt
          done

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-lock-ci.txt
          pip install -r requirements-dev.txt
          pip install pytest-xdist

      # test_issue566_config_loader_native.py parses the frontend config via
      # the TypeScript compiler. Issue #742: the parser dependency installs
      # OUTSIDE the repo tree ($RUNNER_TEMP) so the Backend checkout never
      # gains a frontend/node_modules — the two issue-258 frontend-toolchain
      # nodes stay scoped to the Frontend job, and the #566 walker resolves
      # `typescript` through NODE_PATH on the Test step below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.2"

      - name: Install TypeScript for the #566 config guardrail (outside the repo tree)
        run: npm install --prefix "$RUNNER_TEMP/h03-gate-ts" typescript@6.0.3

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        # Step-level timeout strictly inside the job's 60-minute budget
        # (issue #742): a post-test wedge is cut off here and names THIS step
        # instead of burning the whole job.
        # -rs: itemize skips (live-marker skips must be visible, not silent — issue #563)
        # --timeout-method=thread: the POSIX-default signal method fires only
        # when the main thread returns to the interpreter loop, so on the
        # demonstrated hang classes it behaves differently — late/never on a
        # GIL-releasing C-block call (the wedge class behind #1021's silent
        # 60-minute stalls), per-test failures on starved-pool joins. The
        # thread method aborts a wedged worker fast and xdist names the hung
        # test. This flag line itself is pinned by
        # backend/tests/test_1021_timeout_wiring.py.
        timeout-minutes: 50
        run: pytest --tb=short -v --timeout=300 --timeout-method=thread -rs -n auto --cov --cov-report=term-missing tests/
        env:
          REDIS_URL: ""
          # #742 / #566: makes the outside-tree TypeScript install resolvable
          # by the walker's `require('typescript')` (cwd stays frontend/, so
          # NODE_PATH carries the dependency instead of node_modules there).
          NODE_PATH: ${{ runner.temp }}/h03-gate-ts/node_modules

      - name: Hang-class timeout canary (#1021)
        # Exercises the timeout mechanism on every non-cancelled run, on
        # Linux, in four shapes (each leg selects exactly one nodeid; the
        # whole file is never collected here): both wedge members abort
        # under the thread method with the full Timeout banner + thread-stack
        # dump; the xdist arm produces the named crashed-worker signature the
        # Test step itself will show on a real wedge; and the contrast leg
        # shows the OLD signal method still interrupts starved-pool joins
        # (its coverage boundary: late/never on the C-block class). A GIL-
        # held hang starves both methods — that residual is disclosed in the
        # #1021 PR, not covered here. The presence of this step and of the
        # Test step's flag is pinned by test_1021_timeout_wiring.py.
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          REDIS_URL: ""
          RUN_CI_HANG_CANARY: "1"
        run: |
          # Every leg below MUST capture rc and end in an explicit contract
          # check that exits 1 — set +e keeps this step fail-open otherwise.
          set +e
          canary="tests/test_ci_hang_canary.py"
          cblock="${canary}::test_wedge_c_block_aborted_by_configured_timeout"
          pooljoin="${canary}::test_wedge_starved_pool_join_aborted_by_configured_timeout"
          logs="${RUNNER_TEMP:-/tmp}"

          timeout 300 pytest "$cblock" -q -p no:cacheprovider -p no:randomly \
            --timeout-method=thread --timeout=30 > "$logs/canary-cblock.log" 2>&1
          rc=$?
          cat "$logs/canary-cblock.log"
          if [ "$rc" -ne 1 ] || ! grep -q 'Timeout' "$logs/canary-cblock.log" \
            || ! grep -q 'Stack of' "$logs/canary-cblock.log" \
            || ! grep -q 'pbkdf2' "$logs/canary-cblock.log"; then
            echo "::error::C-block canary did not abort as configured (rc=$rc)"
            exit 1
          fi

          timeout 300 pytest "$pooljoin" -q -p no:cacheprovider -p no:randomly \
            --timeout-method=thread --timeout=30 > "$logs/canary-pooljoin.log" 2>&1
          rc=$?
          cat "$logs/canary-pooljoin.log"
          if [ "$rc" -ne 1 ] || ! grep -q 'Timeout' "$logs/canary-pooljoin.log" \
            || ! grep -q 'Stack of' "$logs/canary-pooljoin.log" \
            || ! grep -qE 'concurrent\.futures|Future\.result|future\.result|shutdown' "$logs/canary-pooljoin.log"; then
            echo "::error::starved-pool-join canary did not abort as configured (rc=$rc)"
            exit 1
          fi

          # The crashed-worker line is xdist 3.x's crash-report format
          # (dsession.py); a future xdist rewording fails this leg closed.
          timeout 300 pytest "$pooljoin" -q -p no:cacheprovider -p no:randomly \
            -n 2 --timeout-method=thread --timeout=30 > "$logs/canary-xdist.log" 2>&1
          rc=$?
          cat "$logs/canary-xdist.log"
          if [ "$rc" -ne 1 ] || ! grep -q 'crashed while running' "$logs/canary-xdist.log" \
            || ! grep -q 'test_wedge_starved_pool_join' "$logs/canary-xdist.log"; then
            echo "::error::xdist canary arm did not produce the named crashed-worker signature (rc=$rc)"
            exit 1
          fi

          timeout 300 pytest "$pooljoin" -q -p no:cacheprovider -p no:randomly \
            --timeout-method=signal --timeout=30 > "$logs/canary-signal.log" 2>&1
          rc=$?
          cat "$logs/canary-signal.log"
          if [ "$rc" -ne 1 ] || ! grep -q 'Timeout' "$logs/canary-signal.log"; then
            echo "::error::signal-contrast leg did not abort the interruptible pool join (rc=$rc)"
            exit 1
          fi
          echo "hang canaries: thread method aborts both wedges with stack dumps; xdist names the hung test; signal method interrupts pool joins (per-test failure)"
