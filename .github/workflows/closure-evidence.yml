name: Closure evidence

# Issue #568 (Workstream K, PR 6 of 7, finding E13): enforce closure evidence
# on `Closes #N` PR bodies and a cross-family second review for
# `high`/`critical` issues. The gate lives in scripts/check_closure_evidence.py
# (evaluate = structural gate; verify-test = re-execution of the named
# evidence test at the pre-fix commit and the PR head). GitHub cannot block
# the merge-time auto-close itself — enforcement is this required failing
# check plus the documented reopen-on-merge procedure in
# docs/ci/closure-evidence-gate.md.
#
# ROLLOUT (one release cycle warning-only, per #568): MODE defaults to warn
# (non-blocking observations). Flip to enforce later by changing the default
# below — that flip is a one-line change documented in the gate doc and the
# pending release note. Rollback: disable or delete this workflow file.
#
# COORDINATION with sibling workflows (issue #565): deliberately distinct
# workflow name ("Closure evidence" vs "CI" / "Nightly" / "Nightly quality
# gates"), job name, and no shared artifacts.

on:
  pull_request:
    branches:
      - master
      - codex/**
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # Re-run on cross-family review events so an outsider's approval unblocks
  # the gate (Copilot review comment id 4052018483): pull_request_review does
  # NOT support a `branches` filter, so base-branch scoping moves into the
  # job's `if`.
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (dispatch proving/dry-run mode)"
        required: true
      mode:
        description: "warn (rollout default) or enforce"
        required: false
        default: "warn"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Include the event name and PR number so two dispatch runs against
  # different PRs from the same branch never cancel each other; repeated
  # events for the SAME PR still dedupe as intended.
  group: closure-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-evidence-gate:
    name: Closure evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Live `gh api` fetching needs the intra-repo token path; fork PRs cannot
    # authenticate it. Dispatch runs are in-repo by construction.
    # pull_request_review cannot carry a `branches` filter (Copilot review id
    # 4052018483), so the base-branch guard for that event lives here.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'pull_request_review' ||
      (github.event.pull_request.base.ref == 'master' ||
      startsWith(github.event.pull_request.base.ref, 'codex/')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Structural gate: closing refs, named evidence, cross-family reviews.
      # The step never fails on its own — the verdict step below applies the
      # mode so warn runs always complete and print their observations.
      # Issue #741: the gate runs the BASE branch's copy of the checker (the
      # preflight below restores scripts/ from the PR's base ref), so a PR
      # that edits the gate cannot grade itself.
      - name: Evaluate closure evidence
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          MODE: ${{ inputs.mode || 'warn' }}
        run: |
          # Issue #741 base-copy preflight. Status-captured so warn mode stays
          # non-blocking: any preflight failure records a truthful ERROR and
          # skips the checker (the Apply-gate-mode step then applies MODE
          # exactly as for any evaluation failure).
          PREFLIGHT_RC=0
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" || PREFLIGHT_RC=$?
          if [ "$PREFLIGHT_RC" -eq 0 ]; then
            BASE_REF="$(printf '%s' "$PR_JSON" | python -I -c "import json,sys; print(json.load(sys.stdin)['base']['ref'])")" || PREFLIGHT_RC=$?
          fi
          if [ "$PREFLIGHT_RC" -eq 0 ] && [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            # A dispatch run checks out the dispatch ref, not the PR; artifact
            # evidence must resolve against the PR head instead. Fetch the PR
            # head ref first: a fork PR's head commit is NOT in the base
            # repository's object database, but GitHub always exposes the PR
            # head as refs/pull/<n>/head on the BASE repo (works for forks).
            HEAD_SHA="$(printf '%s' "$PR_JSON" | python -I -c "import json,sys; print(json.load(sys.stdin)['head']['sha'])")" || PREFLIGHT_RC=$?
            if [ "$PREFLIGHT_RC" -eq 0 ]; then
              git fetch origin "refs/pull/$PR_NUMBER/head" || PREFLIGHT_RC=$?
            fi
            if [ "$PREFLIGHT_RC" -eq 0 ]; then
              git checkout "$HEAD_SHA" || PREFLIGHT_RC=$?
            fi
          fi
          restore_base_gate() {
            # The BASE branch's copy of the gate scripts (#741): the rest of
            # this block then runs the base copy of the checker, so a PR that
            # edits the gate cannot grade itself. Defined unconditionally;
            # invoked (and failure-captured) only when the preflight is clean.
            git checkout "origin/$BASE_REF" -- scripts/
          }
          if [ "$PREFLIGHT_RC" -eq 0 ]; then
            restore_base_gate || PREFLIGHT_RC=$?
          fi
          EVAL_RC=0
          GATE_RAN=1
          if [ "$PREFLIGHT_RC" -ne 0 ]; then
            echo "closure-evidence: ERROR — base-copy preflight failed (rc=$PREFLIGHT_RC); gate not run in this state" | tee evaluate.log
            EVAL_RC=1
            GATE_RAN=0
          else
            # python -I (isolated mode): a PR-added module under scripts/ or
            # the working directory cannot shadow stdlib imports of the base
            # copy of the checker.
            python -I scripts/check_closure_evidence.py evaluate \
              --pr "$PR_NUMBER" --repo-slug "$GITHUB_REPOSITORY" --mode "$MODE" \
              > evaluate.log 2>&1 || EVAL_RC=$?
            cat evaluate.log
          fi
          TEST_ID="$(grep -m1 '^closure-evidence: evidence-test ' evaluate.log | sed 's/^closure-evidence: evidence-test //')"
          {
            echo "eval_rc=$EVAL_RC"
            echo "gate_ran=$GATE_RAN"
            echo "test_id=$TEST_ID"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      # Behavioral gate: re-execute the named evidence test at the merge-base
      # (pre-fix commit; must FAIL there — a brand-new test counts, it cannot
      # run pre-fix) and at the PR head (must PASS). Base commit source:
      # git merge-base of the PR's base branch and HEAD.
      - name: Re-execute the named evidence test (verify-test)
        id: verify
        if: steps.evaluate.outputs.test_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          TEST_ID: ${{ steps.evaluate.outputs.test_id }}
        run: |
          python -m pip install --quiet -r backend/requirements-ci.txt -r backend/requirements-dev.txt
          # Resolve base/head SHAs from the PR itself: on workflow_dispatch,
          # github.event.pull_request is null and github.sha would point at the
          # dispatch checkout, not the PR — so fetch both from the API (works
          # identically for pull_request events). Every preflight call here is
          # status-captured like the Evaluate step: a transient gh/git failure
          # must reach the mode-application step as a verification failure
          # (VERIFY_RC=1) instead of hard-aborting the job under bash -e.
          VERIFY_PRE_RC=0
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" || VERIFY_PRE_RC=$?
          if [ "$VERIFY_PRE_RC" -eq 0 ]; then
            BASE_REF="$(printf '%s' "$PR_JSON" | python -I -c "import json,sys; print(json.load(sys.stdin)['base']['ref'])")" || VERIFY_PRE_RC=$?
          fi
          if [ "$VERIFY_PRE_RC" -eq 0 ]; then
            HEAD_SHA="$(printf '%s' "$PR_JSON" | python -I -c "import json,sys; print(json.load(sys.stdin)['head']['sha'])")" || VERIFY_PRE_RC=$?
          fi
          if [ "$VERIFY_PRE_RC" -eq 0 ]; then
            BASE_SHA="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" || VERIFY_PRE_RC=$?
          fi
          if [ "$VERIFY_PRE_RC" -ne 0 ]; then
            echo "closure-evidence: ERROR — verify-test preflight failed (rc=$VERIFY_PRE_RC); re-execution not run"
            echo "verify_rc=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verify-test base=$BASE_SHA head=$HEAD_SHA test=$TEST_ID"
          # GitHub Actions runs run: blocks under bash -e: capture the
          # verify-test exit status with || so a FAILED verification (the
          # normal violating-PR case) reaches the mode-application step
          # instead of aborting this step — warn mode must stay non-blocking.
          # python -I per issue #741: the base copy of the checker runs in
          # isolated mode (no script-dir/cwd sys.path shadowing).
          VERIFY_RC=0
          python -I scripts/check_closure_evidence.py verify-test \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --test "$TEST_ID" \
            > verify.log 2>&1 || VERIFY_RC=$?
          cat verify.log
          echo "verify_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          exit 0

      # The MODE governs the exit code only (diagnostics above are always
      # truthful): warn completes green with its WARN/ERROR observations;
      # enforce fails the required check on any evaluation or re-execution
      # violation.
      - name: Apply gate mode (warn / enforce)
        env:
          EVAL_RC: ${{ steps.evaluate.outputs.eval_rc }}
          VERIFY_RC: ${{ steps.verify.outputs.verify_rc }}
          MODE: ${{ steps.evaluate.outputs.mode }}
          GATE_RAN: ${{ steps.evaluate.outputs.gate_ran }}
        run: |
          # Issue #1049 review (PRR-007): a gate that never RAN (preflight
          # failure) must not be labeled a violation — the FAIL/WARN tokens
          # key the documented reopen procedure. GATE_RAN defaults to 1 so
          # legacy/absent outputs keep the historical violation semantics.
          if [ "${GATE_RAN:-1}" != "1" ]; then
            echo "closure-evidence: ERROR — gate not run (preflight failed; see the evaluate step); no violation observed"
            if [ "$MODE" = "enforce" ]; then exit 1; fi
            exit 0
          fi
          VIOLATION=0
          if [ "$EVAL_RC" != "0" ]; then VIOLATION=1; fi
          if [ -n "${VERIFY_RC:-}" ] && [ "$VERIFY_RC" != "0" ]; then VIOLATION=1; fi
          if [ "$MODE" = "enforce" ] && [ "$VIOLATION" != "0" ]; then
            echo "closure-evidence: FAIL — enforce-mode violation (see evaluate/verify output above)"
            exit 1
          fi
          if [ "$VIOLATION" != "0" ]; then
            echo "closure-evidence: WARN — violation observed in warn mode (non-blocking rollout)"
          else
            echo "closure-evidence: OK"
          fi
