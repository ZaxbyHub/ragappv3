name: Nightly

# ENH-007 / legacy-10: the PR gate runs on the reduced CI dependency set
# (requirements-ci.txt; heavy parsers stubbed by test modules), so the real
# document pipeline never executes there. This scheduled tier installs the
# FULL parser stack from backend/requirements.txt (which carries
# unstructured[all-docs] plus the pdf/docx/pptx/xlsx extras) and:
#   1. runs the committed real_docs fixture parser tests (table extraction
#      per format + the image-only scanned-page zero-text contract) together
#      with the lifespan FTS validation suite,
#   2. runs the FULL backend suite as a plain full run — the whole-tree
#      execution doubles as the cross-file isolation check,
#   3. runs the parser bake-off harness and uploads its benchmark markdown
#      as an artifact (nothing is committed).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  full-deps:
    name: Full deps (real parsers + full suite + bake-off)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 poppler-utils tesseract-ocr

      - name: Install full parser stack (backend/requirements.txt incl. unstructured[all-docs])
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-xdist

      - name: Verify the real parser stack is importable
        run: |
          python -c "import unstructured; from unstructured.partition.auto import partition; print('unstructured', unstructured.__version__)"

      - name: Real-parser fixture tests (real_docs + lifespan FTS validation)
        # Same hang-class coverage as the full-suite step (#1021): these
        # real-parser paths are exactly the C-extension-heavy code the wedge
        # class lives in, and nothing else bounds this step.
        run: pytest --tb=short -v -s --timeout=300 --timeout-method=thread tests/test_real_docs_parsing.py tests/test_lifespan_fts_validation.py

      - name: Full backend suite (plain full run = cross-file isolation check)
        # --timeout-method=thread: same hang-class coverage as the CI Backend
        # job's Test step (#1021) — the signal method cannot fire on a
        # GIL-releasing C-block wedge.
        run: pytest --tb=short -q --timeout=300 --timeout-method=thread -n auto tests/
        env:
          REDIS_URL: ""

      - name: Parser bake-off (unstructured hi_res vs fast; Docling/marker when installed)
        working-directory: ${{ github.workspace }}
        run: python scripts/parser_bakeoff.py

      - name: Upload parser bake-off benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-bakeoff
          path: docs/benchmarks/parser-bakeoff.md
          # warn, not error: if the bake-off script itself failed, the job
          # already failed at that step with the real error — a missing file
          # here should not mask it with a misleading upload failure
          # (PR #577 review, MEDIUM).
          # An `if-no-files-found` input belongs UNDER `with:` — at step level
          # it is not a valid Actions step key and GitHub rejects the whole
          # workflow file (issue #739: the nightly tier silently never ran
          # for two weeks because of exactly that mis-indentation).
          if-no-files-found: warn
