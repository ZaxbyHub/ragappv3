# Opt-in GPU pinning for the TEI services (issue #570, C29).
#
# Usage (Docker Compose >= 2.24 — the !override tag is required; a plain
# override would APPEND a second device reservation instead of replacing
# the base `count: 1` entry):
#
#   EMBED_GPU_DEVICE_IDS=1 RERANK_GPU_DEVICE_IDS=0 \
#     docker compose -f docker-compose.yml -f docker-compose.gpu-pins.yml up -d
#
# Values accept GPU indexes ("0", "1", ...) or full UUIDs ("GPU-<uuid>" from
# `nvidia-smi -L`); UUIDs survive hardware reordering. Unset variables fail
# the compose command outright (`:?required` errors) rather than silently
# pinning to nothing. Without this file, `docker compose up` keeps the
# unpinned `count: 1` reservation of docker-compose.yml — single-GPU hosts
# need none of this.
#
# See docs/gpu-host-layouts.md for the full placement guide (both candidate
# layouts for the 2x RTX 2000E + RTX 1000-class host, VRAM sizing, and the
# host-side Ollama / LM Studio pinning notes).
services:
  harrier-embed:
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${EMBED_GPU_DEVICE_IDS:?EMBED_GPU_DEVICE_IDS required (GPU index or GPU-<uuid>)}"]
              capabilities: [gpu]

  reranker:
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${RERANK_GPU_DEVICE_IDS:?RERANK_GPU_DEVICE_IDS required (GPU index or GPU-<uuid>)}"]
              capabilities: [gpu]
