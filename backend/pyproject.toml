[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Test files: stub-package imports (lancedb/pyarrow/unstructured) are intentionally
# imported for conftest.py compatibility; E402 and E722 common in test helpers;
# F841 unused variables common in test fixtures and diagnostic assertions
"tests/*.py" = ["F401", "E402", "E722", "F821", "F841"]
"test_*.py" = ["F401", "E402", "E722", "F821", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Any marker used in tests/ must be registered here (or come from a plugin).
# The `live` marker gates tests that perform real network I/O: tests/conftest.py
# skips them with a visible reason unless RAGAPP_LIVE_TESTS=1 (issue #563 / C10
# — replaces import-time probes of localhost:9090 that silently skipped in CI
# and drove foreign listeners on dev hosts).
addopts = "--strict-markers -W error::RuntimeWarning"
markers = [
    "live: performs real network I/O; skipped unless RAGAPP_LIVE_TESTS=1",
]
# Warnings-as-errors (issue #565 / E06): RuntimeWarnings fail the suite instead
# of scrolling past in the summary. This escalates the in-band emission paths
# (pytest's global -W filter raises at the warn site); the GC-timed
# "coroutine ... was never awaited" shape is closed separately by the conftest
# session guard in tests/conftest.py, because inside coroutine.__del__ a raised
# warning cannot propagate — it routes to sys.unraisablehook and pytest re-emits
# it as PytestUnraisableExceptionWarning, which no filter can escalate.
# Note: the issue text's literal `error::pytest.PytestUnhandledCoroutineWarning`
# is NOT used — that warning class does not exist in pytest 9.1.1 (verified:
# the entry crashes pytest at startup with "module 'pytest' has no attribute
# PytestUnhandledCoroutineWarning"). The async-test-misconfiguration class it
# targeted (async test methods inside sync unittest.TestCase subclasses, which
# auto mode silently drops) is closed by the AST collection guard in
# tests/conftest.py instead.
filterwarnings = [
    "error::RuntimeWarning",
]

# Mutation testing (issue #565 / E06). The nightly-quality-gates workflow
# rewrites `source_paths` per guard-module run and captures per-module stats;
# mutmut 3.x requires fork support, so it runs on the ubuntu nightly only
# (upstream boxed/mutmut#397 blocks native Windows). `pytest_add_cli_args`
# keeps the strict pytest config (addopts/-W/filterwarnings) active inside
# mutant test runs.
[tool.mutmut]
source_paths = ["app/security.py"]
pytest_add_cli_args = "-p no:randomly"

# Coverage gating (H4). Scoped to the SSRF guard modules — these are small,
# fully exercised in CI, and the security-critical surface this issue's SSRF
# work touches. A blanket app/ gate would be cargo-cult here because heavy-dep
# modules (vector_store, document_processor) are stubbed in CI and measure as
# uncoverable, which would trap future PRs through no fault of the author.
# app.security is excluded because it is large (303 stmts) and only partially
# exercised by any given test file; its coverage is tracked by the broader
# suite over time. See issue #152.
[tool.coverage.run]
source = ["app.services.ssrf", "app.services.curator_ssrf"]
branch = false

[tool.coverage.report]
# ssrf.py + curator_ssrf.py baseline measured at ~96%. Set at 90 to leave
# headroom while still catching real regressions in the SSRF guards.
fail_under = 90
show_missing = true
