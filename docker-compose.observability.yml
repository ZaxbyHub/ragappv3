# Optional observability overlay (issue #518, Workstream E3).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# What this overlay ACTUALLY configures out of the box (swarm review,
# honesty fix): an Alloy container that scrapes the backend's Prometheus
# exposition (GET /metrics on the backend port) and is wired to fan out to
# a remote_write endpoint. Trace and log collection are NOT configured —
# the Tempo/Loki endpoints in observability/alloy/config.alloy are marked
# placeholders you must point at your existing stack. Entirely optional:
# the base compose file has no observability dependencies and air-gapped
# installs are unaffected. Direct OTLP export from the backend is
# available via the pinned optional pip extra
# backend/requirements-otel.txt + OTEL_EXPORTER_OTLP_ENDPOINT
# (see docs/operations.md; GenAI semantic conventions are Development
# status).

services:
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy:/etc/alloy:ro
    ports:
      - "127.0.0.1:12345:12345"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Tempo/Loki/Grafana are intentionally NOT pinned here: point Alloy at
  # your existing stack by editing observability/alloy/config.alloy. This
  # overlay only guarantees collection from the knowledgevault service.
